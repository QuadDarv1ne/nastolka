# ─────────────────────────────────────────────────────────────
# Amvera — конфигурация через Dockerfile
# https://docs.amvera.ru
# ─────────────────────────────────────────────────────────────
#
# Этот файл использует Dockerfile в корне репозитория.
# Amvera автоматически соберёт образ и запустит контейнер.
#
# Перед деплоем:
#   1. Создайте проект на https://cloud.amvera.ru/
#   2. Подключите этот Git-репозиторий (или используйте Amvera как origin)
#   3. В настройках проекта укажите:
#      - среда: Docker
#      - порт контейнера: 3000
#      - публичный порт: 80 (по умолчанию)
#   4. Готово — пуш в ветку main автоматически соберёт и задеплоит приложение

meta:
  environment: docker

# Явно указываем, что используется Dockerfile
build:
  skip: false

run:
  # Standalone-сервер Next.js слушает порт 3000
  containerPort: 3000
  # Amvera проксирует трафик с публичного URL (обычно порт 80)
  # на указанный containerPort
